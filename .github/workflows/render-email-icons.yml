name: Render email signature PNGs

on:
  push:
    branches:
      - main
    paths:
      - 'assets/email_*.svg'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-email-signature-icons-${{ github.ref }}
  cancel-in-progress: true


jobs:

  render:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-email-icons.txt


      - name: Install Cairo
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev


      - name: Install Python packages
        run: |
          python -m pip install -r requirements-email-icons.txt


      - name: Convert SVG icons to PNG
        run: |
          python scripts/convert_email_svgs.py


      - name: Commit generated PNG files
        run: |

          if [ -z "$(git status --porcelain -- assets/*.png)" ]; then
            echo "No PNG changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/*.png
          git commit -m "chore: render email signature PNG icons"
          git push